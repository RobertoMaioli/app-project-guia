services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: guiacampobelo
      MYSQL_USER: guia
      MYSQL_PASSWORD: guia_dev_pw
      MYSQL_ROOT_PASSWORD: root_dev_pw
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-uroot', '-proot_dev_pw']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
